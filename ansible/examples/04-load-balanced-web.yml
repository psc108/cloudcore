---
# 04-load-balanced-web.yml
# VPC + two web instances + an application (L7) load balancer with both as backends.
# Run: ansible-playbook -i ../inventory.ini 04-load-balanced-web.yml
- name: "Example 04 — Load-balanced web tier (L7 ALB)"
  hosts: localhost
  gather_facts: false

  vars:
    env: "{{ default_environment }}"
    project: "{{ default_project }}"
    vpc_name: "{{ project }}-{{ env }}-{{ build_suffix }}-main"
    lb_name: "{{ project }}-{{ env }}-{{ build_suffix }}-alb"
    instances:
      - name: "{{ project }}-{{ env }}-{{ build_suffix }}-web-01"
        subnet_id: subnet-local-01
      - name: "{{ project }}-{{ env }}-{{ build_suffix }}-web-02"
        subnet_id: subnet-local-01

  tasks:
    - name: Create VPC
      cloudcore.cloudcore.vpc:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ vpc_name }}"
        cidr_block: "10.10.0.0/16"
        dns_support: true
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
      register: vpc

    - name: Create web instances
      cloudcore.cloudcore.instance:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ item.name }}"
        image_id: ubuntu-22.04
        flavor: standard.small
        vpc_id: "{{ vpc.vpc.id }}"
        subnet_id: "{{ item.subnet_id }}"
        user_data: |
          #cloud-config
          # apt_preserve_sources_list + bootcmd point this guest at
          # the host-level package repo (api/build-package-repo.sh,
          # haFullStack.md §14) exclusively, the same pattern every
          # other example uses — promtail is only ever cached there
          # (a third-party Grafana Labs package, never in the real
          # Ubuntu archive), so this redirect is required, not
          # optional, once it's in packages: below.
          apt_preserve_sources_list: true
          bootcmd:
            - |
              cat > /etc/apt/sources.list <<'EOF'
              deb [trusted=yes] http://192.168.100.1:8090/jammy/apt-repo ./
              EOF

          package_update: true
          packages: [nginx, promtail]

          write_files:
            # Centralized logging (haFullStack-LLD.md §12) — ships
            # this node's own journal, cloud-init-output.log, and
            # nginx's own access/error logs to the host-level Loki
            # service. __HOSTNAME__ fixed up in runcmd below, same
            # sed-substitution idiom this platform already uses
            # elsewhere.
            - path: /etc/promtail/config.yml
              content: |
                server:
                  http_listen_port: 9080
                  grpc_listen_port: 0

                positions:
                  filename: /tmp/positions.yaml

                clients:
                  # Fixed address, not a discovered/templated one — Loki is a
                  # host-level, always-on service (api/setup-logging-service.sh,
                  # haFullStack-LLD.md §12), the same platform-capability pattern as
                  # the host-level package repo (192.168.100.1:8090, §7) rather than a
                  # dedicated per-example node. Every example's own promtail ships
                  # here, which is what makes log coverage apply no matter which
                  # example gets built, not just this one.
                  - url: http://192.168.100.1:3100/loki/api/v1/push

                # __HOSTNAME__ is fixed up at boot (this node's real hostname isn't
                # known until runtime) via the same sed-substitution idiom this stack
                # already uses for frontend's own index.html (__HOSTNAME__) and
                # render-keepalived-conf.sh's __IFACE__ — see each tier's own
                # cloud-init runcmd for the caller.
                scrape_configs:
                  # journald already captures every systemd-managed service on this
                  # node (nginx, mysql, apache2, rabbitmq-server, keepalived, proxysql,
                  # memcached, every *-status.timer, step-renew, quorum-watchdog) with
                  # zero per-service enumeration needed.
                  - job_name: journal
                    journal:
                      max_age: 12h
                      labels:
                        job: journal
                        host: __HOSTNAME__
                    relabel_configs:
                      - source_labels: ['__journal__systemd_unit']
                        target_label: 'unit'

                  # Not journal-backed the same way — and the single most useful file
                  # this whole project's own debugging has repeatedly reached for (most
                  # of haFullStack-Findings-Log.md's real findings were first spotted
                  # here, not in journalctl).
                  - job_name: cloud-init-output
                    static_configs:
                      - targets:
                          - localhost
                        labels:
                          job: cloud-init-output
                          host: __HOSTNAME__
                          __path__: /var/log/cloud-init-output.log

                  # Per-service log FILES, not just what each service's own systemd
                  # unit happens to emit to stdout/stderr (journal, above) — a real
                  # gap noticed only once someone asked "are we watching everything?"
                  # directly. One shared config applied to every tier alike (same as
                  # every scrape_config above) rather than a per-tier variant — a path
                  # that doesn't exist on a given node (e.g. the nginx target on a
                  # MySQL node) is a harmless no-op for promtail's own file-target
                  # discovery, not an error, so there's no need to fork this file per
                  # service. /var/lib/proxysql is intentionally NOT glob-matched
                  # (*.log only) — that directory also holds this node's own TLS
                  # private key material (proxysql-key.pem); see
                  # proxysql-cloud-init.yaml.tftpl's own setfacl step for exactly how
                  # promtail is granted access to proxysql.log specifically without
                  # touching those files' own permissions at all.
                  - job_name: nginx
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: nginx
                          host: __HOSTNAME__
                          __path__: /var/log/nginx/*.log

                  - job_name: mysql
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: mysql
                          host: __HOSTNAME__
                          __path__: /var/log/mysql/error.log

                  # rabbitmq's own log files are group-owned "rabbitmq", not "adm" —
                  # confirmed live (real "permission denied" until promtail was also
                  # added to that group; see rabbitmq-cloud-init.yaml.tftpl's own
                  # runcmd).
                  - job_name: rabbitmq
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: rabbitmq
                          host: __HOSTNAME__
                          __path__: /var/log/rabbitmq/*.log

                  - job_name: apache2
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: apache2
                          host: __HOSTNAME__
                          __path__: /var/log/apache2/*.log

                  - job_name: proxysql
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: proxysql
                          host: __HOSTNAME__
                          __path__: /var/lib/proxysql/proxysql.log

          runcmd:
            # F-073/F-072 promtail fix, first, before nginx starts
            # (F-076, haFullStack-Findings-Log.md — promtail's own
            # package postinst auto-starts it immediately once
            # installed, before this runcmd block gets a chance to
            # fix up __HOSTNAME__ or grant the "adm" group needed to
            # read root:adm 0640 /var/log/cloud-init-output.log).
            - systemctl stop promtail || true
            - sed "s/__HOSTNAME__/$(hostname)/" -i /etc/promtail/config.yml
            - usermod -aG adm promtail
            - systemctl enable --now promtail
            - systemctl enable --now nginx
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: web
      loop: "{{ instances }}"
      register: created_instances

    - name: Wait for all instances to reach running
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/instances/{{ item.instance.id }}"
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
      register: poll
      until: poll.json.status == "running"
      retries: 30
      delay: 5
      loop: "{{ created_instances.results }}"
      loop_control:
        label: "{{ item.instance.name }}"

    - name: Create application load balancer
      cloudcore.cloudcore.load_balancer:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ lb_name }}"
        type: application
        vpc_id: "{{ vpc.vpc.id }}"
        subnet_ids:
          - subnet-local-01
        internal: false
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: ingress
      register: lb

    - name: Register instances as backends
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/load-balancers/{{ lb.load_balancer.id }}/backends"
        method: POST
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ item.json.name }}"
          address: "{{ item.json.private_ip }}"
          port: 80
        status_code: 201
      loop: "{{ poll.results }}"
      loop_control:
        label: "{{ item.json.name }}"

    - name: Show load balancer
      ansible.builtin.debug:
        msg: >
          ALB {{ lb.load_balancer.name }} listen_port={{ lb.load_balancer.listen_port }}
          dns={{ lb.load_balancer.dns_name }}
