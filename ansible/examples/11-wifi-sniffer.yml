---
# 11-wifi-sniffer.yml
# VPC + security group + a single instance running Kismet (fed by a
# passed-through USB WiFi adapter in monitor mode) + the aircrack-ng suite,
# fronted by a network (L4/TCP-passthrough) load balancer — Kismet's live
# dashboard is WebSocket-driven, same reasoning as the Ghidra template's
# noVNC. Ansible port of examples/wifi-sniffer (OpenTofu).
# Run: ansible-playbook -i ../inventory.ini 11-wifi-sniffer.yml \
#        -e usb_device_id=0bda:8812
- name: "Example 11 — WiFi sniffer"
  hosts: localhost
  gather_facts: false

  vars:
    env: "{{ default_environment }}"
    project: "{{ default_project }}"
    vpc_name: "{{ project }}-{{ env }}-{{ build_suffix }}-main"
    sg_name: "{{ project }}-{{ env }}-{{ build_suffix }}-sniffer-sg"
    instance_name: "{{ project }}-{{ env }}-{{ build_suffix }}-sniffer-01"
    lb_name: "{{ project }}-{{ env }}-{{ build_suffix }}-sniffer-lb"
    admin_cidr: "0.0.0.0/0"
    instance_flavor: standard.medium
    lb_port: 8700
    rtl8812au_driver_ref: "v5.6.4.2"
    # SHA-256 of the rtl8812au_driver_ref source tree, tarred by
    # `api/build-package-repo.sh` into its own pinned-artifact cache
    # (haFullStack.md §14) at rtl8812au-<ref>.tar.gz.
    rtl8812au_driver_sha256: "114f0334f08612652e0d9f5dbf38359d894db26c75f210667cdec1800f805cec"
    # No generic default is possible — this needs your specific physical
    # adapter's host USB ID. Same "obvious placeholder + assert" approach
    # as vnc_password in 09-ghidra-workstation.yml, since this collection's
    # vars: have no native "no default = required" concept. Run the
    # "Show host USB devices" task below (or `-e usb_device_id=...` on the
    # command line) to find the real value first.
    usb_device_id: "CHANGE_ME:0000"
    # Leave blank to keep the instance local (the default -- everything
    # below is a no-op). To put it on a paired remote host instead, set
    # peer_id (see the Dashboard's Peers section, or the peer_info
    # Ansible module, for available hosts) AND peer_vpc_id/
    # peer_subnet_id/peer_security_group_id to THAT peer's own
    # vpc_id/subnet_id/security_group_id. None of the three are optional
    # once peer_id is set: a remote peer has its own separate
    # VPC/subnet/security-group catalogue, not this build's local one —
    # this playbook's own sg (created above) only ever exists on THIS
    # host (see haFullStack-LLD.md §13, and the security_group_ids
    # placement_overrides field modules/instance-group gained after
    # F-092 for the same requirement in the Terraform world). Note
    # usb_device_id itself is unaffected by peer placement in name, but
    # its VALUE must be a device id that physically exists on whichever
    # host actually ends up creating the instance -- the USB adapter
    # this sniffer needs is plugged into a specific machine, peer or not.
    peer_id: ""
    peer_vpc_id: ""
    peer_subnet_id: ""
    peer_security_group_id: ""

  tasks:
    - name: List host USB devices
      cloudcore.cloudcore.usb_device_info:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
      register: usb

    - name: Show host USB devices
      ansible.builtin.debug:
        msg: >-
          {{ usb.devices | map(attribute='id') | zip(usb.devices | map(attribute='description'))
             | map('join', ' — ') | list }}

    - name: Require a real usb_device_id
      ansible.builtin.assert:
        that:
          - usb_device_id != "CHANGE_ME:0000"
          - usb_device_id is match("^[0-9a-fA-F]{4}:[0-9a-fA-F]{4}$")
        fail_msg: >-
          Set usb_device_id to your WiFi adapter's real "vendor_id:product_id"
          (see the USB device list above), e.g. -e usb_device_id=0bda:8812.

    - name: Create VPC
      cloudcore.cloudcore.vpc:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ vpc_name }}"
        cidr_block: "10.40.0.0/16"
        dns_support: true
        tags: &common_tags
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
      register: vpc

    - name: Create security group
      cloudcore.cloudcore.security_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ sg_name }}"
        vpc_id: "{{ vpc.vpc.id }}"
        description: "WiFi sniffer — SSH + dashboard, scoped to admin_cidr"
        ingress_rules:
          - protocol: tcp
            from_port: 22
            to_port: 22
            cidr: "{{ admin_cidr }}"
          - protocol: tcp
            from_port: "{{ lb_port }}"
            to_port: "{{ lb_port }}"
            cidr: "{{ admin_cidr }}"
        egress_rules:
          - protocol: "-1"
            cidr: "0.0.0.0/0"
        tags:
          <<: *common_tags
          Role: sniffer-sg
      register: sg

    - name: Create sniffer instance
      cloudcore.cloudcore.instance:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ instance_name }}"
        image_id: ubuntu-22.04
        flavor: "{{ instance_flavor }}"
        vpc_id: "{{ peer_vpc_id if peer_id != '' else vpc.vpc.id }}"
        subnet_id: "{{ peer_subnet_id if peer_id != '' else 'subnet-local-01' }}"
        security_group_ids: ["{{ peer_security_group_id if peer_id != '' else sg.security_group.id }}"]
        usb_device_ids: ["{{ usb_device_id }}"]
        peer_id: "{{ peer_id }}"
        tags:
          <<: *common_tags
          Role: sniffer
        user_data: |
          #cloud-config
          # WiFi sniffer: Kismet (WebSocket-driven live dashboard) fed by a
          # passed-through USB WiFi adapter running the aircrack-ng-maintained
          # RTL8812AU driver in monitor mode, plus the aircrack-ng suite/tshark/
          # hcxtools for deeper offline analysis over SSH.
          #
          # Kismet is configured onto port 80 (its own default is 2501) to match
          # the one guest port this platform's per-instance hostfwd/target-group
          # plumbing forwards — same reason the Ghidra template's noVNC listens on
          # 80 rather than its own tool defaults.

          # linux-headers-generic and linux-modules-extra-generic are deliberately
          # NOT in packages: below — installing kernel-module packages by the
          # generic/floating meta-name is wrong here, verified the hard way: it
          # pulled in a newer kernel image than the one actually running (the base
          # image ships 187, "-generic" resolved to 191), which needs a reboot to
          # take effect — meanwhile the headers/modules-extra that got installed
          # were for the NOT-yet-booted 191 kernel, not the running 187 one, so
          # the DKMS build and modprobe would both target the wrong kernel
          # entirely. These two are installed via runcmd instead, pinned to
          # $(uname -r) explicitly, so they always match whatever kernel this
          # instance actually boots.
          #
          # apt_preserve_sources_list + bootcmd point this guest at the
          # host-level package repo (`api/build-package-repo.sh`,
          # haFullStack.md §14) exclusively, the same pattern
          # ha-frontend-lb's own tiers already use — every package below
          # (including kismet, only ever in a third-party
          # kismetwireless.net repo, not Ubuntu's own archive, and the
          # exact linux-headers-$(uname -r)/linux-modules-extra-$(uname -r)
          # pair runcmd installs further down) is pre-cached there, so
          # nothing here reaches the real internet at guest-boot time.
          # kismet-common's critical-priority debconf question has to be
          # preseeded in bootcmd, not runcmd — bootcmd is cloud-init's
          # earliest hook, the only one guaranteed to run before the
          # packages: module below actually installs kismet and trips
          # that prompt.
          apt_preserve_sources_list: true
          bootcmd:
            - |
              cat > /etc/apt/sources.list <<'EOF'
              deb [trusted=yes] http://192.168.100.1:8090/jammy/apt-repo ./
              EOF
              echo 'kismet-common kismet-common/install-setuid boolean true' | debconf-set-selections

          package_update: true
          packages:
            - build-essential
            - dkms
            - bc
            - libelf-dev
            - git
            - curl
            - gnupg
            - ca-certificates
            - aircrack-ng
            - hcxtools
            - hcxdumptool
            - tcpdump
            - kismet
            - promtail

          write_files:
            # Centralized logging (haFullStack-LLD.md §12) — ships this node's own
            # journal + cloud-init-output.log to the host-level Loki service.
            # __HOSTNAME__ fixed up in runcmd below, same sed-substitution idiom
            # this platform already uses for other __-wrapped placeholders.
            - path: /etc/promtail/config.yml
              content: |
                server:
                  http_listen_port: 9080
                  grpc_listen_port: 0

                positions:
                  filename: /tmp/positions.yaml

                clients:
                  # Fixed address, not a discovered/templated one — Loki is a
                  # host-level, always-on service (api/setup-logging-service.sh,
                  # haFullStack-LLD.md §12), the same platform-capability pattern as
                  # the host-level package repo (192.168.100.1:8090, §7) rather than a
                  # dedicated per-example node. Every example's own promtail ships
                  # here, which is what makes log coverage apply no matter which
                  # example gets built, not just this one.
                  - url: http://192.168.100.1:3100/loki/api/v1/push

                # __HOSTNAME__ is fixed up at boot (this node's real hostname isn't
                # known until runtime) via the same sed-substitution idiom this stack
                # already uses for frontend's own index.html (__HOSTNAME__) and
                # render-keepalived-conf.sh's __IFACE__ — see each tier's own
                # cloud-init runcmd for the caller.
                scrape_configs:
                  # journald already captures every systemd-managed service on this
                  # node (nginx, mysql, apache2, rabbitmq-server, keepalived, proxysql,
                  # memcached, every *-status.timer, step-renew, quorum-watchdog) with
                  # zero per-service enumeration needed.
                  - job_name: journal
                    journal:
                      max_age: 12h
                      labels:
                        job: journal
                        host: __HOSTNAME__
                    relabel_configs:
                      - source_labels: ['__journal__systemd_unit']
                        target_label: 'unit'

                  # Not journal-backed the same way — and the single most useful file
                  # this whole project's own debugging has repeatedly reached for (most
                  # of haFullStack-Findings-Log.md's real findings were first spotted
                  # here, not in journalctl).
                  - job_name: cloud-init-output
                    static_configs:
                      - targets:
                          - localhost
                        labels:
                          job: cloud-init-output
                          host: __HOSTNAME__
                          __path__: /var/log/cloud-init-output.log

                  # Per-service log FILES, not just what each service's own systemd
                  # unit happens to emit to stdout/stderr (journal, above) — a real
                  # gap noticed only once someone asked "are we watching everything?"
                  # directly. One shared config applied to every tier alike (same as
                  # every scrape_config above) rather than a per-tier variant — a path
                  # that doesn't exist on a given node (e.g. the nginx target on a
                  # MySQL node) is a harmless no-op for promtail's own file-target
                  # discovery, not an error, so there's no need to fork this file per
                  # service. /var/lib/proxysql is intentionally NOT glob-matched
                  # (*.log only) — that directory also holds this node's own TLS
                  # private key material (proxysql-key.pem); see
                  # proxysql-cloud-init.yaml.tftpl's own setfacl step for exactly how
                  # promtail is granted access to proxysql.log specifically without
                  # touching those files' own permissions at all.
                  - job_name: nginx
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: nginx
                          host: __HOSTNAME__
                          __path__: /var/log/nginx/*.log

                  - job_name: mysql
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: mysql
                          host: __HOSTNAME__
                          __path__: /var/log/mysql/error.log

                  # rabbitmq's own log files are group-owned "rabbitmq", not "adm" —
                  # confirmed live (real "permission denied" until promtail was also
                  # added to that group; see rabbitmq-cloud-init.yaml.tftpl's own
                  # runcmd).
                  - job_name: rabbitmq
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: rabbitmq
                          host: __HOSTNAME__
                          __path__: /var/log/rabbitmq/*.log

                  - job_name: apache2
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: apache2
                          host: __HOSTNAME__
                          __path__: /var/log/apache2/*.log

                  - job_name: proxysql
                    static_configs:
                      - targets: [localhost]
                        labels:
                          job: proxysql
                          host: __HOSTNAME__
                          __path__: /var/lib/proxysql/proxysql.log

            - path: /var/www/placeholder/index.html
              content: |
                <!doctype html>
                <html><head><title>WiFi sniffer — building</title>
                <meta http-equiv="refresh" content="10">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <style>
                  body { font-family: sans-serif; background: #1a1a1a; color: #eee;
                         display: flex; height: 100vh; margin: 0;
                         align-items: center; justify-content: center; text-align: center; }
                  div { max-width: 32em; padding: 2em; }
                  h1 { font-size: 1.3em; }
                </style>
                </head><body><div>
                <h1>Your WiFi monitoring dashboard is still building&hellip;</h1>
                <p>First boot installs Kismet, the aircrack-ng suite, and builds
                the WiFi adapter's driver from source — this normally takes a
                couple of minutes. This page checks again every 10 seconds and
                will switch to the dashboard automatically. Nothing to do here —
                just leave this tab open.</p>
                </div></body></html>

            - path: /etc/systemd/system/placeholder.service
              content: |
                [Unit]
                Description=WiFi sniffer — "still building" placeholder page
                # kismet.service takes over port 80 the moment it starts; systemd
                # stops this one automatically as part of that transaction, on
                # first boot and on every subsequent reboot alike — no manual
                # handoff logic needed.
                Conflicts=kismet.service

                [Service]
                Type=simple
                ExecStart=/usr/bin/python3 -m http.server 80 --directory /var/www/placeholder --bind 0.0.0.0
                Restart=on-failure

                [Install]
                WantedBy=multi-user.target

            - path: /etc/systemd/system/kismet.service.d/override.conf
              content: |
                [Unit]
                Conflicts=placeholder.service

            - path: /etc/modprobe.d/blacklist-rtl8xxxu.conf
              content: |
                # Ubuntu's in-kernel rtl8xxxu driver can claim this adapter before
                # the aircrack-ng driver gets a chance to, and doesn't support
                # monitor mode for this chipset. Keep it from ever binding.
                blacklist rtl8xxxu

            - path: /etc/udev/rules.d/81-wifi-passthrough-no-autosuspend.rules
              content: |
                # USB autosuspend on a monitor-mode adapter causes exactly the kind
                # of intermittent captures/injection failures that are hard to
                # diagnose after the fact — disable it unconditionally for this driver.
                ACTION=="add", SUBSYSTEM=="usb", DRIVERS=="88XXau", TEST=="power/control", ATTR{power/control}="on"

            - path: /etc/kismet/kismet_site.conf
              content: |
                httpd_port=80
                log_prefix=/home/ubuntu/kismet-logs/
                # source=<interface> is appended by runcmd once the driver is built
                # and the adapter's interface name is known — it isn't predictable
                # ahead of time (Ubuntu's persistent naming gives USB WiFi adapters
                # names like wlx<mac>, not wlan0).

          runcmd:
            # F-073/F-072 promtail fix, first, before any other service on
            # this node starts (F-076, haFullStack-Findings-Log.md —
            # running this after other service-setup steps left a real
            # window where promtail's still-__HOSTNAME__-labeled,
            # postinst-started instance could ship log content under
            # the wrong host label). promtail's own package postinst
            # auto-starts it immediately once installed, before this
            # runcmd block gets a chance to fix up __HOSTNAME__ or
            # grant the "adm" group needed to read root:adm 0640
            # /var/log/cloud-init-output.log.
            - systemctl stop promtail || true
            - sed "s/__HOSTNAME__/$(hostname)/" -i /etc/promtail/config.yml
            - usermod -aG adm promtail
            - systemctl enable --now promtail

            # Placeholder first, before anything slow — this is what makes opening
            # desktop_url immediately after apply show a "please wait" page instead
            # of a browser connection error while the rest of this runs.
            - [ systemctl, daemon-reload ]
            - [ systemctl, enable, --now, placeholder.service ]

            # Kernel headers + the wireless-modules package (cfg80211/mac80211 —
            # Ubuntu splits these out of the base kernel-modules package to keep
            # server/cloud images smaller), pinned to the exact running kernel —
            # see the note above packages: for why this can't be the "-generic"
            # floating name.
            - [ sh, -c, "apt-get install -y linux-headers-$(uname -r) linux-modules-extra-$(uname -r)" ]

            # tshark: preseed the debconf question packaging asks interactively
            # ("should non-superusers be able to capture packets?") before install,
            # since this runs unattended — then let the ubuntu user actually use
            # that. Installed via runcmd rather than the packages: list above
            # specifically so this preseed lands before apt processes it (packages:
            # installs run before runcmd, so an earlier attempt in packages: would
            # already have prompted/defaulted before any preseed could apply).
            - [ sh, -c, "echo 'wireshark-common wireshark-common/install-setuid boolean true' | debconf-set-selections" ]
            - [ sh, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y tshark" ]
            - [ usermod, -aG, wireshark, ubuntu ]

            # kismet itself now installs as part of the packages: list above
            # (its debconf question was preseeded in bootcmd, before that
            # install ever ran) — nothing left to do here but add ubuntu
            # to the group its package creates.
            - [ usermod, -aG, kismet, ubuntu ]

            # RTL8812AU driver: the aircrack-ng-maintained fork is the only one
            # with working monitor mode + injection for this chipset (the
            # commonly-suggested morrownr fork is explicit in its own README that
            # it does NOT support monitor mode — wrong tool for this adapter).
            #
            # Downloaded from the host-level package repo's pinned-artifact
            # cache (`api/build-package-repo.sh` clones
            # {{ rtl8812au_driver_ref }} from GitHub once and tars it up as
            # rtl8812au-<ref>.tar.gz — see its own ARTIFACT_URLS-adjacent
            # RTL8812AU_REF block), verified by checksum, not a live
            # `git clone` from GitHub at every guest boot. Same
            # stall-tolerant retry loop as before even though this is now
            # a same-host transfer, not a real internet fetch — cheap
            # insurance, no reason to remove it.
            - |
              for attempt in 1 2 3 4 5; do
                curl -fSL --connect-timeout 15 --speed-limit 51200 --speed-time 20 \
                  -C - -o /tmp/rtl8812au.tar.gz \
                  http://192.168.100.1:8090/jammy/artifacts/rtl8812au-{{ rtl8812au_driver_ref }}.tar.gz && break
                echo "rtl8812au download attempt $attempt stalled/failed, retrying..." >&2
                sleep 5
              done
              echo '{{ rtl8812au_driver_sha256 }}  /tmp/rtl8812au.tar.gz' | sha256sum -c -
              rm -rf /opt/rtl8812au
              tar -xzf /tmp/rtl8812au.tar.gz -C /opt
              rm -f /tmp/rtl8812au.tar.gz
              cd /opt/rtl8812au
              make dkms_install
              rmmod rtl8xxxu 2>/dev/null || true
              # cfg80211 provides symbols 88XXau needs (cfg80211_*, ieee80211_*).
              # On a normal desktop it's auto-loaded the moment real WiFi hardware
              # is detected via a module-alias match, before any driver for it
              # would run — but that detection path can't be relied on here
              # unconditionally, so load it explicitly rather than assuming it.
              modprobe cfg80211
              modprobe 88XXau

            # Re-trigger udev now that the driver's actually bound, so the
            # no-autosuspend rule above (matched on DRIVERS=="88XXau") applies —
            # it couldn't match anything before this point.
            - [ udevadm, trigger, "--action=add", "--subsystem-match=usb" ]

            # The adapter's interface name isn't predictable ahead of time
            # (Ubuntu's persistent-naming gives USB WiFi adapters names like
            # wlx<mac>) — detect it after the driver's bound rather than guessing.
            - |
              iface=""
              for attempt in $(seq 1 30); do
                for d in /sys/class/net/*/wireless; do
                  [ -d "$d" ] || continue
                  iface=$(basename "$(dirname "$d")")
                  break
                done
                [ -n "$iface" ] && break
                sleep 2
              done
              if [ -z "$iface" ]; then
                echo "ERROR: no wireless interface appeared after driver install" >&2
              else
                echo "source=$iface" >> /etc/kismet/kismet_site.conf
              fi

            # Kismet runs as root (its packaged systemd unit), so log files it
            # creates here would otherwise be root-owned despite the directory
            # itself being chowned to ubuntu. setgid makes new files inherit the
            # ubuntu group automatically, so scp/rm/mv from the ubuntu user works
            # without sudo — chown alone on the directory wouldn't achieve that.
            - [ sh, -c, "mkdir -p /home/ubuntu/kismet-logs" ]
            - [ chown, "ubuntu:ubuntu", /home/ubuntu/kismet-logs ]
            - [ chmod, "2775", /home/ubuntu/kismet-logs ]

            - [ systemctl, daemon-reload ]
            - [ systemctl, enable, kismet.service ]
            - [ systemctl, restart, kismet.service ]
      register: instance

    - name: Wait for instance running
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/instances/{{ instance.instance.id }}"
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
      register: poll
      until: poll.json.status == "running"
      retries: 30
      delay: 5
      tags: [wait]

    - name: Create load balancer
      cloudcore.cloudcore.load_balancer:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ lb_name }}"
        type: network
        vpc_id: "{{ vpc.vpc.id }}"
        internal: false
        tags:
          <<: *common_tags
          Role: ingress
      register: lb

    - name: Create target group
      cloudcore.cloudcore.lb_target_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        lb_id: "{{ lb.load_balancer.id }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-sniffer-tg"
        port: 80
        protocol: tcp
        targets:
          - instance_id: "{{ instance.instance.id }}"
            port: 80
      register: tg

    - name: Create listener
      cloudcore.cloudcore.lb_listener:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        lb_id: "{{ lb.load_balancer.id }}"
        port: "{{ lb_port }}"
        protocol: tcp
        target_group_id: "{{ tg.target_group.id }}"

    - name: Show access info
      ansible.builtin.debug:
        msg: >
          desktop_url=http://127.0.0.1:{{ lb_port }}/,
          ssh=ssh -p {{ poll.json.ssh_port }} ubuntu@127.0.0.1
