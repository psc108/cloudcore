    # Own, independent peer-placement (not auto-inherited from
    # coordinator_peer_id -- nothing in this playbook auto-inherits
    # another resource's placement, worker_peers/coordinator_peer_id
    # are already independently specified today). Full-text search
    # against a pre-built Xapian index is fast and cheap, so the
    # sensible default is pointing this at the SAME peer as the
    # coordinator for the lowest-latency retrieval hop -- not automatic,
    # set both explicitly if that's wanted.
    kiwix_peer_id: ""
    kiwix_peer_vpc_id: ""
    kiwix_peer_subnet_id: ""
    kiwix_peer_security_group_id: ""

    # --- Phase 3: central learning corpus capture ---------------------
    # Fixed host-level address, same convention as promtail's own Loki
    # target — api/examples_listener.py's own dedicated, always-on bind,
    # confirmed reachable both from local guests and, across the
    # WireGuard tunnel, from a peer-placed coordinator's own host
    # network (192.168.100.0/24 is in every paired peer's own
    # AllowedIPs — see wireguard.py's render_config). One fixed address
    # covers both placements, no peer-specific templating needed.
    #
    # Deliberately a separate token from cloudcore_api_token/
    # cloudcore_api_url (those two are excluded from ever reaching
    # Terraform variables by tofu_engine.py's own _build_env(); the
    # equivalent Ansible path has no such exclusion, but naming this
    # one distinctly keeps both engines' own examples.tf/.yml
    # documentation and behaviour identical). Must match the API host's
    # own CLOUDCORE_API_TOKEN.
    examples_api_base: "http://192.168.100.1:8083"
    examples_ingestion_token: "dev-token"

    # CloudCore Dashboard -- LLM Performance page's "live deployments"
    # registry (verify_proxy.py's own register_llm_deployment(), api/
    # llm_deployments_routes.py). Must match the coordinator instance's
    # actual name below ("Create coordinator instance"'s own `name:`) --
    # computed here, before that task runs, the same reasoning
    # examples/llm-chat/locals.tf's own coordinator_deployment_name
    # local documents for the Terraform path.
    deployment_name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-coord"

    # --- Phase 4: interactive sandbox ----------------------------------
    # Genuinely distinct from webui_system_message above — that one only
    # ever shaped llama-server's own general-purpose webui, which this
    # phase makes unreachable (GET / now serves the sandbox instead). A
    # mitigation, not a guarantee (a system prompt can still be talked
    # around) — the real safety net stays run_sandboxed()'s own
    # real-execution grounding, same as Phases 1-2. Stage 5 update:
    # absorbed webui_system_message's own anti-hallucination wording
    # (that variable is otherwise vestigial now, so the lesson it
    # already learned was just sitting unused) and added awareness of
    # the Terminal panel/preview ports, which this prompt previously
    # had zero knowledge of at all — see examples/llm-chat/variables.tf's
    # own matching variable comment for the fuller reasoning.
    sandbox_system_message: >-
      You are a lab coding assistant. Only discuss the Python code the
      student has provided in this conversation. If asked something
      unrelated to that code or to this lab exercise, politely decline
      and redirect the student back to their code. Only describe what
      code actually does -- never claim a function, sort, or check
      exists unless it is genuinely present in the code you just wrote
      or were shown; if you are not certain something is correct, say
      so explicitly rather than stating it as fact. When suggesting a
      fix, provide the complete corrected script in a single fenced
      python code block, and keep your own explanation concise -- this
      hardware generates slowly, so prefer a short, precise answer over
      a long one where both would be equally correct. Code you write
      runs in a real sandbox that supports interactive input() calls --
      if a script you wrote is waiting for input, you will be shown
      exactly what it has printed so far and asked what to provide;
      reply with ONLY a fenced ```stdin block containing exactly the
      one line to send. This can happen a few times per script, not
      unlimited, so keep prompts short and avoid scripts that would
      need a long back-and-forth. This code sandbox is Python-only,
      one-shot, and has no network access. Separately, the page's own
      Terminal panel gives a real persistent Linux shell with genuine
      internet access (pip install, curl, cloning a repo) that is
      otherwise fully isolated, plus ports __PREVIEW_PORTS_LIST__
      reachable from
      the browser for previewing a web app run there -- if asked about
      installing packages, running something long-lived, or viewing a
      web app's own output, say to use the Terminal (whose own panel
      lists the exact ports), not this code sandbox.

    # Stage 8 — a second, genuinely separate system prompt for the new
    # Linux Help panel (verify_proxy.py's POST /sandbox/linux-ask). Not
    # scoped to "the student's own code" the way sandbox_system_message
    # above is, and doesn't describe an auto-execution/fix loop either
    # -- a shell command suggested here only runs if the student clicks
    # the page's own "Run in Terminal" button against their already-live
    # Terminal session. See examples/llm-chat/variables.tf's own
    # matching variable comment for the fuller reasoning.
    linux_system_message: >-
      You are a Linux help assistant for a lab environment. Answer any
      Linux question, from everyday usage (files, permissions,
      searching, editors) through real system administration (systemd,
      networking, package management, users and groups, disk and
      filesystem, cron, log inspection) -- the student may be a
      complete beginner or already comfortable at the command line, so
      don't assume either. Only describe what a command actually does
      -- never claim a flag or behavior exists unless you are genuinely
      sure of it; if you are not certain something is correct, say so
      explicitly rather than stating it as fact. When you suggest a
      command, put it in its own fenced ```bash code block so the
      student can run it with one click -- a command you suggest is
      NEVER run without the student clicking 'Run in Terminal'
      themselves, but once they do, the real result IS automatically
      checked: if it fails, you will be shown the real terminal
      transcript and exit code and asked to diagnose it and suggest a
      fix, same as this turn. This hardware generates slowly, so keep
      answers short and precise rather than long where both would be
      equally correct. The student's own Terminal panel is a real, minimal
      Ubuntu 22.04 shell with genuine internet access, but: its package
      index only covers the 'main' archive component (a 'universe'
      package needs another route), it has no persistent storage
      across sessions, and it cannot reach anything on the local
      network except the real internet. Ports __PREVIEW_PORTS_LIST__
      are reachable from the student's browser for previewing anything
      they serve there. This is a genuinely minimal image -- ordinary
      tools you might expect (e.g. fdisk) are often not preinstalled.
      If a command you suggest might need one, give ONLY ONE fenced
      ```bash block for it, combining the install check and the real
      command with `||` in that single block -- for example exactly
      `command -v fdisk >/dev/null || sudo apt-get install -y fdisk;
      fdisk -l /dev/vda` (adjust the tool/package name and real
      command). Do NOT also show a plain, naive version of the command
      on its own first -- that copy would just fail with 'command not
      found' if the tool is missing, defeating the whole point. The
      student should only ever need to click 'Run in Terminal' once,
      on the one block you give them. Politely decline anything
      clearly unrelated to Linux or this lab and redirect back to that.

    # Stage 4 — per-client rate limiting, keyed by the real client IP
    # via X-Forwarded-For (examples/llm-chat's own LB sets option
    # forwardfor, HTTP mode) — see verify_proxy.py's own _client_ip().
    # Ask is far more expensive than Run (a real model generation plus
    # sandboxed execution, possibly several fix rounds), hence the
    # wider window and separate limit.
    rate_limit_run_per_minute: 10
    rate_limit_ask_per_10min: 10

    # Stage 5 — Firecracker sandbox shell. Same pinned-download-plus-
    # checksum convention as llama_release_tag/llama_archive_name/
    # llama_sha256 above; kept in sync by hand with
    # api/build-package-repo.sh's own ARTIFACT_URLS. See
    # llm-chat-interactive-sandbox-Phased-Implementation.md's own Stage 5
    # section for the full design.
    firecracker_release_tag: v1.17.0
    firecracker_archive_name: firecracker-v1.17.0-x86_64.tgz
    firecracker_sha256: 06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
    firecracker_kernel_name: firecracker-vmlinux-6.1.155
    firecracker_kernel_sha256: e20e46d0c36c55c0d1014eb20576171b3f3d922260d9f792017aeff53af3d4f2
    # Rebuilt by api/build-firecracker-rootfs.sh — update these two by
    # hand whenever that script is re-run.
    firecracker_rootfs_name: firecracker-rootfs-jammy.ext4.gz
    firecracker_rootfs_sha256: d4662e397860a133ce7a2b8d803faee55ade15ccd297a39c7e48f76dded28fb4
    # Deliberately outside both the platform's own real bridge range
    # (192.168.x.0/24) and this example's own fictional declared VPC CIDR
    # (10.91.0.0/16 default) — no overlap with either.
    sandbox_subnet_cidr: 10.200.0.0/24

    # Stage 5B — sandbox_terminal.py's own tunables. Defaults sized
    # against this repo's own existing conventions — see
    # examples/llm-chat/variables.tf's own matching variable comments
    # for the fuller reasoning.
    terminal_port: 8622
    terminal_idle_timeout_minutes: 15
    terminal_max_session_minutes: 60
    terminal_max_concurrent_sessions: 4
    terminal_boot_timeout_seconds: 20

    # Direct follow-up — is the platform prepared for a student running
    # something destructive (e.g. partitioning the running root fs)
    # from a Terminal session? The architecture already recovers
    # cleanly on its own; the real gap was a guest left unusable but
    # whose SSH channel doesn't error (kernel/sshd still resident in
    # RAM), which the idle timeout can't catch since retyping into a
    # dead shell still counts as activity. See
    # examples/llm-chat/variables.tf's own matching variable comment.
    terminal_unresponsive_seconds: 30

    # Fixed pool of high ports reverse-proxied into whichever microVM a
    # student's own terminal session is currently using — see
    # examples/llm-chat/variables.tf's own preview_ports comment for the
    # fuller reasoning. join()'d the same way at the point of use as
    # examples_ingestion_token/etc. below, since these become one comma-
    # separated systemd Environment= value both services parse.
    preview_ports: [41001, 41002, 41003, 41004]

    # jammy's own python3-websockets (9.1-1) is confirmed broken on
    # jammy's own current Python 3.10.12 (asyncio.Lock(loop=...), a
    # parameter Python 3.10 removed outright) -- vendored instead. See
    # examples/llm-chat/variables.tf's matching variable comment.
    websockets_wheel_name: websockets-16.1.1-cp310-manylinux.whl
    websockets_wheel_sha256: 1214e673c404684b9bf7154f5cf43b45025b1a6160fac3a9e438e9c1a97e22cb

    # F-127 follow-up, direct request, short-term: give Claude Code its
    # own real SSH access to every instance this playbook creates --
    # diagnosing F-127's own still-open deadlock (and anything like it
    # in the future) needs a live /proc/<pid>/task/*/stack capture,
    # impossible from the outside and impossible for Claude Code itself
    # when an instance lands on a peer host it has no other access to.
    # A dedicated keypair (api/keys/claude_debug_ed25519*, gitignored,
    # never committed), not CloudCore's own inter-instance keypair, so
    # this access is distinguishable in auth logs and independently
    # revocable. Explicitly toggleable per direct request ("allow it to
    # be turned off via the template should it be required") -- flip to
    # false and rebuild to drop it from every instance. See
    # examples/llm-chat/variables.tf's matching Terraform variables.
    enable_claude_debug_access: true
    claude_debug_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBsvg7yGQHL+ezs9craT31EBXuZb9PzBLs3CX4/7tIii claude-debug@cloudcore"

  tasks:
    # F-126: empty is now a real, deliberately supported configuration
    # — direct request to keep worker_peers/RPC offloading fully
    # intact for later (better hardware) while letting the coordinator
    # run the entire model itself in the meantime, on whichever single
    # host (including a peer, via coordinator_peer_id) can actually
    # carry it alone. The old fail-fast guard here assumed cross-host
    # splitting was this playbook's only supported shape — true when
    # it was written, but no longer the only one a real, current-
    # hardware constraint can call for. llama_rpc_flags (below) already
    # degrades correctly to "no offload, run every layer locally" when
    # this is empty — nothing else assumes a worker exists.

    - name: Create VPC
      cloudcore.cloudcore.vpc:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ vpc_name }}"
        cidr_block: "10.91.0.0/16"
        dns_support: true
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
      register: vpc

    - name: Create coordinator security group (SSH + chat Web UI/API)
      cloudcore.cloudcore.security_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ sg_name }}"
        vpc_id: "{{ vpc.vpc.id }}"
        description: "LLM chat coordinator — SSH + chat Web UI/API, scoped to admin_cidr"
        ingress_rules:
          - protocol: tcp
            from_port: 22
            to_port: 22
            cidr: "{{ admin_cidr }}"
          - protocol: tcp
            from_port: "{{ http_port }}"
            to_port: "{{ http_port }}"
            cidr: "{{ admin_cidr }}"
        egress_rules:
          - protocol: "-1"
            cidr: 0.0.0.0/0
      register: sg

    - name: Load shared promtail config
      ansible.builtin.set_fact:
        promtail_config: "{{ lookup('file', 'templates/llm-chat/promtail-config.yml.j2') }}"

    - name: Build the claude-debug users list (empty when disabled)
      ansible.builtin.set_fact:
        claude_debug_users: "{{ enable_claude_debug_access | ternary([{'username': 'claude-debug', 'sudo': true, 'ssh_keys': [claude_debug_ssh_public_key]}], []) }}"

    - name: Render worker user_data (identical for every worker)
      ansible.builtin.set_fact:
        worker_user_data: "{{ lookup('template', 'templates/llm-chat/worker-cloud-init.yml.j2', template_vars={
          'llama_archive_name': llama_archive_name, 'llama_sha256': llama_sha256,
          'rpc_port': rpc_port, 'threads': threads,
          'promtail_config': promtail_config }) }}"

    - name: Create RPC worker instances (one per worker_peers entry, each on its own peer)
      cloudcore.cloudcore.instance:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-worker-{{ idx }}"
        image_id: ubuntu-22.04
        flavor: "{{ worker_flavor }}"
        vpc_id: "{{ item.peer_vpc_id }}"
        subnet_id: "{{ item.peer_subnet_id }}"
        security_group_ids: ["{{ item.peer_security_group_id }}"]
        peer_id: "{{ item.peer_id }}"
        user_data: "{{ worker_user_data }}"
        users: "{{ claude_debug_users }}"
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: llm-chat-worker
      loop: "{{ worker_peers }}"
      loop_control:
        index_var: idx
        label: "worker-{{ idx }} -> {{ item.peer_id }}"
      register: created_workers

    - name: Wait for all workers to reach running
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/instances/{{ item.instance.id }}"
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
      register: worker_poll
      until: worker_poll.json.status == "running"
      retries: 30
      delay: 5
      loop: "{{ created_workers.results }}"
      loop_control:
        label: "{{ item.instance.name }}"

    - name: Build the coordinator's --rpc argument from real worker IPs
      ansible.builtin.set_fact:
        rpc_servers: "{{ worker_poll.results | map(attribute='json.private_ip') | map('regex_replace', '$', ':' + (rpc_port | string)) | join(',') }}"

    - name: Create kiwix security group (SSH + retrieval-grounding search API)
      cloudcore.cloudcore.security_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-kiwix"
        vpc_id: "{{ vpc.vpc.id }}"
        description: "LLM chat retrieval-grounding (kiwix-serve) — SSH + search API, scoped to admin_cidr"
        ingress_rules:
          - protocol: tcp
            from_port: 22
            to_port: 22
            cidr: "{{ admin_cidr }}"
          - protocol: tcp
            from_port: "{{ kiwix_port }}"
            to_port: "{{ kiwix_port }}"
            cidr: "{{ admin_cidr }}"
        egress_rules:
          - protocol: "-1"
            cidr: 0.0.0.0/0
      register: kiwix_sg

    - name: Render kiwix user_data
      ansible.builtin.set_fact:
        kiwix_user_data: "{{ lookup('template', 'templates/llm-chat/kiwix-cloud-init.yml.j2', template_vars={
          'kiwix_port': kiwix_port,
          'kiwix_tools_version': kiwix_tools_version,
          'kiwix_tools_url': kiwix_tools_url,
          'kiwix_tools_sha256': kiwix_tools_sha256,
          'wikipedia_zim_filename': wikipedia_zim_filename,
          'wikipedia_zim_url': wikipedia_zim_url,
          'wikipedia_zim_sha256': wikipedia_zim_sha256,
          'mankier_zim_filename': mankier_zim_filename,
          'mankier_zim_url': mankier_zim_url,
          'mankier_zim_sha256': mankier_zim_sha256,
          'archwiki_zim_filename': archwiki_zim_filename,
          'archwiki_zim_url': archwiki_zim_url,
          'archwiki_zim_sha256': archwiki_zim_sha256,
          'pydocs_zim_filename': pydocs_zim_filename, 'pydocs_zim_url': pydocs_zim_url, 'pydocs_zim_sha256': pydocs_zim_sha256,
          'pypeps_zim_filename': pypeps_zim_filename, 'pypeps_zim_url': pypeps_zim_url, 'pypeps_zim_sha256': pypeps_zim_sha256,
          'devdocs_python_zim_filename': devdocs_python_zim_filename, 'devdocs_python_zim_url': devdocs_python_zim_url, 'devdocs_python_zim_sha256': devdocs_python_zim_sha256,
          'devdocs_numpy_zim_filename': devdocs_numpy_zim_filename, 'devdocs_numpy_zim_url': devdocs_numpy_zim_url, 'devdocs_numpy_zim_sha256': devdocs_numpy_zim_sha256,
          'devdocs_pandas_zim_filename': devdocs_pandas_zim_filename, 'devdocs_pandas_zim_url': devdocs_pandas_zim_url, 'devdocs_pandas_zim_sha256': devdocs_pandas_zim_sha256,
          'devdocs_django_zim_filename': devdocs_django_zim_filename, 'devdocs_django_zim_url': devdocs_django_zim_url, 'devdocs_django_zim_sha256': devdocs_django_zim_sha256,
          'devdocs_flask_zim_filename': devdocs_flask_zim_filename, 'devdocs_flask_zim_url': devdocs_flask_zim_url, 'devdocs_flask_zim_sha256': devdocs_flask_zim_sha256,
          'devdocs_fastapi_zim_filename': devdocs_fastapi_zim_filename, 'devdocs_fastapi_zim_url': devdocs_fastapi_zim_url, 'devdocs_fastapi_zim_sha256': devdocs_fastapi_zim_sha256,
          'devdocs_matplotlib_zim_filename': devdocs_matplotlib_zim_filename, 'devdocs_matplotlib_zim_url': devdocs_matplotlib_zim_url, 'devdocs_matplotlib_zim_sha256': devdocs_matplotlib_zim_sha256,
          'devdocs_scikit_learn_zim_filename': devdocs_scikit_learn_zim_filename, 'devdocs_scikit_learn_zim_url': devdocs_scikit_learn_zim_url, 'devdocs_scikit_learn_zim_sha256': devdocs_scikit_learn_zim_sha256,
          'devdocs_requests_zim_filename': devdocs_requests_zim_filename, 'devdocs_requests_zim_url': devdocs_requests_zim_url, 'devdocs_requests_zim_sha256': devdocs_requests_zim_sha256,
          'devdocs_jinja_zim_filename': devdocs_jinja_zim_filename, 'devdocs_jinja_zim_url': devdocs_jinja_zim_url, 'devdocs_jinja_zim_sha256': devdocs_jinja_zim_sha256,
          'devdocs_click_zim_filename': devdocs_click_zim_filename, 'devdocs_click_zim_url': devdocs_click_zim_url, 'devdocs_click_zim_sha256': devdocs_click_zim_sha256,
          'devdocs_pygame_zim_filename': devdocs_pygame_zim_filename, 'devdocs_pygame_zim_url': devdocs_pygame_zim_url, 'devdocs_pygame_zim_sha256': devdocs_pygame_zim_sha256,
          'promtail_config': promtail_config }) }}"

    - name: Create kiwix instance (retrieval-grounding backend, F-132)
      # vpc_id/subnet_id/security_group_ids/peer_id fall back to this
      # build's own local resources when kiwix_peer_id is empty (the
      # default) — otherwise switch to the chosen peer's own existing
      # catalogue entries, same pattern the coordinator's own placement
      # already proves works.
      cloudcore.cloudcore.instance:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-kiwix"
        image_id: ubuntu-22.04
        flavor: "{{ kiwix_flavor }}"
        vpc_id: "{{ kiwix_peer_vpc_id if kiwix_peer_id else vpc.vpc.id }}"
        subnet_id: "{{ kiwix_peer_subnet_id if kiwix_peer_id else 'subnet-local-01' }}"
        security_group_ids: ["{{ kiwix_peer_security_group_id if kiwix_peer_id else kiwix_sg.security_group.id }}"]
        peer_id: "{{ kiwix_peer_id }}"
        user_data: "{{ kiwix_user_data }}"
        users: "{{ claude_debug_users }}"
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: llm-chat-kiwix
      register: kiwix

    - name: Wait for kiwix to reach running
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/instances/{{ kiwix.instance.id }}"
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
      register: kiwix_poll
      until: kiwix_poll.json.status == "running"
      retries: 30
      delay: 5

    - name: Capture kiwix's real private IP for the coordinator's own verify-proxy.service
      ansible.builtin.set_fact:
        kiwix_host: "{{ kiwix_poll.json.private_ip }}"

    # Direct request: keep worker_peers/RPC offloading fully intact for
    # later (better hardware), but make "coordinator alone, zero
    # workers" a genuinely, cleanly supported configuration right now.
    # With zero workers, rpc_servers above is an empty string, and the
    # old unconditional "-ngl {{ rpc_offload_layers }} --rpc {{ rpc_servers }}"
    # in the coordinator's own ExecStart line would collapse to
    # "--rpc  -ngl 37" (the empty substitution merging two flags' own
    # whitespace) -- command-line parsing would then read "-ngl" as
    # --rpc's own value, not a separate flag, breaking llama-server's
    # own startup outright. Omitted entirely instead when there are no
    # workers -- llama.cpp already treats no -ngl / no --rpc as "run
    # every layer locally, no offload anywhere".
    - name: Build the coordinator's llama-server RPC flags (empty when there are no workers)
      ansible.builtin.set_fact:
        llama_rpc_flags: "{{ (worker_peers | length > 0) | ternary('-ngl ' + (rpc_offload_layers | string) + ' --rpc ' + rpc_servers + ' ', '') }}"

    - name: Build the Web UI defaults JSON (llama-server's own --webui-config-file)
      ansible.builtin.set_fact:
        webui_config_json: "{{ {'temperature': webui_temperature, 'systemMessage': webui_system_message} | to_nice_json }}"

    - name: Load verify_proxy.py source (grounded code verification)
      ansible.builtin.set_fact:
        verify_proxy_source: "{{ lookup('file', 'templates/llm-chat/verify_proxy.py') }}"

    - name: Load sandbox_terminal.py source (Stage 5B sandbox terminal)
      ansible.builtin.set_fact:
        sandbox_terminal_source: "{{ lookup('file', 'templates/llm-chat/sandbox_terminal.py') }}"

    - name: Load CodeMirror assets (Stage 2 — interactive sandbox editor)
      # Same vendored build the Dashboard's own Editor page already
      # ships (ui/vendor/, two levels up from this playbook's own
      # directory) — read fresh and re-embedded into this guest's own
      # cloud-init, since the dashboard's own /vendor/ route only ever
      # reaches the admin host, never a student-facing coordinator.
      ansible.builtin.set_fact:
        codemirror_core_js: "{{ lookup('file', '../../ui/vendor/codemirror.min.js') }}"
        codemirror_core_css: "{{ lookup('file', '../../ui/vendor/codemirror.min.css') }}"
        codemirror_theme_css: "{{ lookup('file', '../../ui/vendor/codemirror-theme-dracula.min.css') }}"
        codemirror_matchbrackets_js: "{{ lookup('file', '../../ui/vendor/codemirror-addon-matchbrackets.min.js') }}"
        codemirror_python_mode_js: "{{ lookup('file', '../../ui/vendor/codemirror-mode-python.min.js') }}"

    - name: Load xterm.js assets (Stage 5B — sandbox terminal)
      # Already vendored for the Dashboard's own admin Terminal feature
      # — reused as-is, same re-embedding reasoning as CodeMirror above.
      ansible.builtin.set_fact:
        xterm_core_js: "{{ lookup('file', '../../ui/vendor/xterm.min.js') }}"
        xterm_core_css: "{{ lookup('file', '../../ui/vendor/xterm.min.css') }}"
        xterm_fit_addon_js: "{{ lookup('file', '../../ui/vendor/xterm-addon-fit.min.js') }}"

    - name: Render coordinator user_data
      ansible.builtin.set_fact:
        coordinator_user_data: "{{ lookup('template', 'templates/llm-chat/coordinator-cloud-init.yml.j2', template_vars={
          'llama_archive_name': llama_archive_name, 'llama_sha256': llama_sha256,
          'model_filename': model_filename, 'model_sha256': model_sha256,
          'http_port': http_port, 'context_size': context_size, 'threads': threads,
          'llama_rpc_flags': llama_rpc_flags, 'promtail_config': promtail_config,
          'webui_config_json': webui_config_json,
          'verify_proxy_source': verify_proxy_source,
          'enable_verification': enable_verification,
          'verify_timeout_seconds': verify_timeout_seconds,
          'verify_max_memory_mb': verify_max_memory_mb,
          'verify_max_fix_rounds': verify_max_fix_rounds,
          'max_continuation_rounds': max_continuation_rounds,
          'generation_stall_timeout_seconds': generation_stall_timeout_seconds,
          'relay_debug': relay_debug,
          'kiwix_host': kiwix_host,
          'kiwix_port': kiwix_port,
          'sentinel_host': sentinel_host,
          'sentinel_port': sentinel_port,
          'examples_api_base': examples_api_base,
          'examples_ingestion_token': examples_ingestion_token,
          'deployment_name': deployment_name,
          'sandbox_system_message': sandbox_system_message,
          'linux_system_message': linux_system_message,
          'rate_limit_run_per_minute': rate_limit_run_per_minute,
          'rate_limit_ask_per_10min': rate_limit_ask_per_10min,
          'firecracker_archive_name': firecracker_archive_name,
          'firecracker_sha256': firecracker_sha256,
          'firecracker_kernel_name': firecracker_kernel_name,
          'firecracker_kernel_sha256': firecracker_kernel_sha256,
          'firecracker_rootfs_name': firecracker_rootfs_name,
          'firecracker_rootfs_sha256': firecracker_rootfs_sha256,
          'sandbox_subnet_cidr': sandbox_subnet_cidr,
          'sandbox_terminal_source': sandbox_terminal_source,
