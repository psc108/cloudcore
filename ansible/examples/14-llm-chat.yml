---
# 14-llm-chat.yml
# A llama.cpp coordinator (loads a GGUF model, runs llama-server) plus
# one or more RPC worker instances, each pinned to a different paired
# peer — same distributed-inference mechanism as
# 13-distributed-llm.yml (built first, for automated Sentinel-log
# ingestion), but this playbook exists purely to give a person a
# browser tab to actually talk to the model. Per direct request:
# "lets create a template thats built solely to provide a llm chat
# interface to 7b or whichever llm we provide in the future... a
# browser frontend for the moment (cli can wait)."
#
# The chat UI itself is NOT custom-built here — llama-server ships its
# own compiled single-page Web UI, enabled by default (--webui,
# confirmed via `llama-server --help` and a real local test: a plain
# `curl` without gzip support gets a 415 on GET / — the same "415 on
# GET /" behavior 13-distributed-llm.yml's own F-097 found and worked
# around for its health check — but any real browser sends
# Accept-Encoding: gzip automatically and gets the genuine chat page).
# This matches the convention every other browser-facing example in
# this project already follows (09-ghidra-workstation.yml,
# 10-kiwix-library.yml): serve the upstream tool's own web interface
# through a load balancer, don't write a new frontend.
#
# SECURITY: llama.cpp's own RPC backend is explicitly documented as a
# "proof-of-concept" that is "fragile and insecure," warning "Never run
# the RPC server on an open network." See worker_peers' own comment
# below for what this means for each worker's own security group.
#
# Run: ansible-playbook -i ../inventory.ini 14-llm-chat.yml
- name: "Example 14 — LLM Chat (llama.cpp RPC, browser Web UI)"
  hosts: localhost
  gather_facts: false

  vars:
    env: "{{ default_environment }}"
    project: "{{ default_project }}"
    vpc_name: "{{ project }}-{{ env }}-{{ build_suffix }}-main"
    sg_name: "{{ project }}-{{ env }}-{{ build_suffix }}-coordinator"
    lb_name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat"

    admin_cidr: "0.0.0.0/0"
    # Deliberately different from 13-distributed-llm.yml's own default
    # (8610) — both playbooks can be built on the same host at once
    # without a port collision on the load balancer's own listener.
    http_port: 8620
    rpc_port: 50052
    # Larger than 13-distributed-llm.yml's own default (2048) — an
    # interactive chat session benefits from more room for conversation
    # history than a single-shot log-ingestion prompt needs, within
    # each participant's own tight RAM ceiling (see coordinator_flavor
    # below).
    context_size: 4096
    threads: 4
    # coordinator_flavor and worker_flavor deliberately do NOT share one
    # value — found live building the first real verify-proxy.service
    # deployment: the coordinator is *always* local (no placement
    # override exists for it in this playbook, unlike workers), so its
    # flavor's vCPU count is really a claim against *this specific
    # host's* real core count, not a generic budget. A 6-vCPU
    # standard.xlarge coordinator on a real 4-core host hit KVM's own
    # "-accel kvm: warning: Number of SMP cpus requested (6) exceeds
    # the recommended cpus supported by KVM (4)" and took 5-6x longer
    # than normal to come up — standard.large (4 vCPU) matches a real
    # 4-core host exactly, not oversubscribed. worker_flavor stays
    # standard.xlarge since a worker peer's own core count is checked
    # for real (api/capacity_gate.py) and this project's own paired
    # peer genuinely has 8 cores. Making the coordinator itself
    # peer-placement-aware (choosing whichever host has the most real
    # spare capacity, the same way api/peers_routes.
    # recommend_placement() already does for other resources) is a
    # real, tracked follow-up — see
    # llm-chat-verification-Phased-Implementation.md's own priority
    # note for why it isn't done yet.
    #
    # Every worker peer's own real available RAM is still checked
    # against whichever worker_flavor is chosen BEFORE the build is
    # even submitted (api/capacity_gate.py) regardless.
    coordinator_flavor: standard.large
    worker_flavor: standard.xlarge

    # llama.cpp's own -ngl flag means "how many of the model's layers to
    # offload to non-CPU backends" (GPU normally, but --rpc's own workers
    # count the same way) -- NOT "how many layers per worker" and NOT a
    # percentage. With exactly one RPC worker configured, every offloaded
    # layer goes to that ONE worker; a high value like the GPU-offload
    # convention's usual 99 ("offload everything possible") tries to push
    # nearly the ENTIRE model onto that single worker instead of splitting
    # it with the coordinator's own local CPU -- found live building the
    # same underlying mechanism for 13-distributed-llm.yml: it tried to
    # allocate a ~4.3GB buffer on a worker with only 4096MB RAM and
    # failed outright.
    #
    # This default (24, half of Qwen2.5-Coder-14B-Instruct's own real 48
    # transformer layers) is only ever a FALLBACK for running this
    # playbook directly (bypassing the CloudCore API entirely). A build
    # submitted through the API instead (POST /v1/builds, what the
    # Dashboard's own Build Manager and Scheduler both do) computes this
    # fresh for every run: api/layer_split.py reads the chosen
    # model_filename's own real layer count straight out of its GGUF
    # header (api/gguf_meta.py — no more hand-maintained "model X has Y
    # layers" comment to keep in sync across model swaps), weighs it
    # against the coordinator's and every worker peer's *current* CPU
    # cores and load, and skews the split toward whichever side has more
    # real spare capacity right now — per direct request: "make it a
    # dynamic calculation... so we constantly adjust resource allocation
    # for wherever it might do the best." Setting rpc_offload_layers
    # explicitly in a build request always wins — the dynamic
    # calculation only fills in a value nobody asked for.
    rpc_offload_layers: 24

    # Pinned artifacts (api/build-package-repo.sh) — exact values kept
    # in sync by hand with that script's own ARTIFACT_URLS, identical
    # to 13-distributed-llm.yml's own (same underlying binaries, this
    # playbook just serves the interactive Web UI they already come
    # with instead of only exposing the raw API).
    llama_archive_name: llama-b11025-bin-ubuntu-x64.tar.gz
    llama_sha256: bfdb3743f689bfe312f6c529908a09fb5ed1249c817b448e6a138ebb9dceb35d
    # Defaults to Qwen2.5-Coder-14B-Instruct rather than a general chat
    # model or the smaller 7B — per direct request: "mistral itself
    # isn't really the best... code/code production/correction/
    # assistance is all i really care about", then, after the 7B still
    # hallucinated in real testing, "is there anything less likely to
    # hallucinate." Same bartowski quantizer already trusted for the
    # Mistral/7B pins. Its ChatML template supports a real system role
    # (confirmed live), unlike Mistral-7B-Instruct-v0.3's own template
    # (confirmed live via GET /props' chat_template_caps.
    # supports_system_role: false), so webui_system_message below
    # actually reaches the model. 13-distributed-llm.yml keeps
    # defaulting to Mistral — its job is Sentinel log summarization, a
    # different task this switch wasn't asked to touch.
    model_filename: Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
    model_sha256: 2946d28c9e1bb2bcae6d42e8678863a31775df6f740315c7d7e6d6b6411f5937

    # llama-server's own built-in Web UI reads its default sampling/
    # system-prompt settings from a JSON file passed via
    # --webui-config-file — confirmed live that its keys are flat
    # top-level settings names (temperature/systemMessage) matching the
    # frontend's own constants map, and that GET /props' own
    # ui_settings key echoes this file's contents verbatim back to the
    # frontend at page load. Deliberately lower than llama-server's own
    # built-in default (0.8) and paired with a system prompt
    # discouraging invented claims about code — per direct request:
    # "what can we do to help prevent hallucination and prevent claims
    # about code that doesn't actually exist in it's answer" followed
    # by "configure the web ui defaults to a more technical
    # configuration (per sampling temperature)." Still fully
    # user-editable per-session in the browser's own Settings panel —
    # this only changes what a fresh session starts from.
    webui_temperature: 0.2
    webui_system_message: >-
      You are a technical assistant. Only describe what code actually
      does — never claim a function, sort, or check exists unless it is
      genuinely present in the code you just wrote or were shown. If
      you are not certain something is correct, say so explicitly
      rather than stating it as fact. Prefer precise, verifiable
      statements over confident-sounding guesses.

    # Grounded code verification — per direct request: prompting alone
    # couldn't be trusted to prevent hallucination ("the lab students
    # can't be allowed to walk away with false education or
    # confidence... even if the answers are wrong then we can show why
    # and how it might be put right") — so any Python code block in a
    # response is actually run in a sandbox on the coordinator (see
    # templates/llm-chat/coordinator-cloud-init.yml.j2's own
    # verify-proxy.service) and the real result is appended into the
    # same chat turn, clearly labeled as executed rather than model
    # output. See llm-chat-verification-Phased-Implementation.md.
    enable_verification: true
    verify_timeout_seconds: 15
    verify_max_memory_mb: 256
    # Phase 2 — grounded fix loop. Widened from an initial default of 1
    # to 3 per direct follow-up ("close the gap [on being able to]
    # iterate until acceptable/correct performance/output is met") — a
    # single automatic attempt was judged too thin for that to feel
    # real. Each round is grounded in the REAL traceback from the
    # attempt before it, never another unverified guess.
    verify_max_fix_rounds: 3

    # One entry per RPC worker instance — the whole point of this
    # playbook. Each worker is pinned to a specific paired peer (see the
    # Dashboard's Peers section, or the peer_info Ansible module, for
    # available hosts) and that peer's own vpc_id/subnet_id/security
    # group — a peer has its own separate catalogue, not this build's
    # local one (see haFullStack-LLD.md §13). Empty by default (the
    # build fails fast below rather than silently doing nothing) — this
    # playbook only exists to prove cross-host distributed inference.
    # Add more entries as more machines join CloudCore; nothing here is
    # hardcoded to exactly two hosts.
    #
    # SECURITY: the worker's security group is an EXISTING one on the
    # peer (peer_security_group_id below), created outside this
    # playbook, so it cannot be enforced here. When creating it,
    # restrict the RPC port (rpc_port above) to this build's own local
    # subnet (where the coordinator lives) — never 0.0.0.0/0. Reusing a
    # broader existing security group defeats the protection the
    # upstream project's own docs explicitly call for.
    worker_peers: []

    # --- Coordinator placement ---------------------------------------
    # Empty by default (all four) — coordinator stays local, exactly
    # today's only behaviour. Per direct follow-up ("should we not
    # place the co-ordinator on the peer with the best available
    # resource?"): this host's own core count is a real, fixed ceiling
    # regardless of flavor (see coordinator_flavor's own comment for a
    # real KVM-oversubscription case this caused), so sometimes the
    # right answer is putting the coordinator itself on a peer
    # instead. Same shape as worker_peers' own four fields, applied to
    # a single instance. api/capacity_gate.py checks a peer-placed
    # coordinator's real available RAM the same way it already does
    # for workers, and both Build Managers' own submit routes reject a
    # request where coordinator_peer_id matches a worker's own
    # peer_id — same machine hosting both roles defeats the entire
    # reason this playbook splits across hosts via RPC.
    #
    # Deliberately not auto-selected — a worker's own security group is
    # an existing one on that peer, scoped narrowly to the RPC port; it
    # was never designed for a coordinator's own needs (SSH + the chat
    # HTTP UI). Pick a real, existing SG on the target peer that
    # actually allows SSH (22) and http_port from admin_cidr — this is
    # not verified automatically.
    coordinator_peer_id: ""
    coordinator_peer_vpc_id: ""
    coordinator_peer_subnet_id: ""
    coordinator_peer_security_group_id: ""

    # --- Phase 3: central learning corpus capture ---------------------
    # Fixed host-level address, same convention as promtail's own Loki
    # target — api/examples_listener.py's own dedicated, always-on bind,
    # confirmed reachable both from local guests and, across the
    # WireGuard tunnel, from a peer-placed coordinator's own host
    # network (192.168.100.0/24 is in every paired peer's own
    # AllowedIPs — see wireguard.py's render_config). One fixed address
    # covers both placements, no peer-specific templating needed.
    #
    # Deliberately a separate token from cloudcore_api_token/
    # cloudcore_api_url (those two are excluded from ever reaching
    # Terraform variables by tofu_engine.py's own _build_env(); the
    # equivalent Ansible path has no such exclusion, but naming this
    # one distinctly keeps both engines' own examples.tf/.yml
    # documentation and behaviour identical). Must match the API host's
    # own CLOUDCORE_API_TOKEN.
    examples_api_base: "http://192.168.100.1:8083"
    examples_ingestion_token: "dev-token"

    # --- Phase 4: interactive sandbox ----------------------------------
    # Genuinely distinct from webui_system_message above — that one only
    # ever shaped llama-server's own general-purpose webui, which this
    # phase makes unreachable (GET / now serves the sandbox instead). A
    # mitigation, not a guarantee (a system prompt can still be talked
    # around) — the real safety net stays run_sandboxed()'s own
    # real-execution grounding, same as Phases 1-2.
    sandbox_system_message: >-
      You are a lab coding assistant. Only discuss the Python code the
      student has provided in this conversation. If asked something
      unrelated to that code or to this lab exercise, politely decline
      and redirect the student back to their code. When suggesting a
      fix, provide the complete corrected script in a single fenced
      python code block. Code you write runs in a non-interactive
      sandbox with no stdin available at all -- never use input() or
      anything else that waits for interactive input, since it will
      always fail with EOFError there. If a script needs example
      values, hardcode a plausible one directly in the code instead.

  tasks:
    - name: Fail fast if worker_peers is empty
      ansible.builtin.fail:
        msg: >-
          worker_peers is empty -- this playbook's whole purpose is
          cross-host distributed inference. Set at least one entry
          (peer_id/peer_vpc_id/peer_subnet_id/peer_security_group_id).
      when: worker_peers | length == 0

    - name: Create VPC
      cloudcore.cloudcore.vpc:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ vpc_name }}"
        cidr_block: "10.91.0.0/16"
        dns_support: true
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
      register: vpc

    - name: Create coordinator security group (SSH + chat Web UI/API)
      cloudcore.cloudcore.security_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ sg_name }}"
        vpc_id: "{{ vpc.vpc.id }}"
        description: "LLM chat coordinator — SSH + chat Web UI/API, scoped to admin_cidr"
        ingress_rules:
          - protocol: tcp
            from_port: 22
            to_port: 22
            cidr: "{{ admin_cidr }}"
          - protocol: tcp
            from_port: "{{ http_port }}"
            to_port: "{{ http_port }}"
            cidr: "{{ admin_cidr }}"
        egress_rules:
          - protocol: "-1"
            cidr: 0.0.0.0/0
      register: sg

    - name: Load shared promtail config
      ansible.builtin.set_fact:
        promtail_config: "{{ lookup('file', 'templates/llm-chat/promtail-config.yml.j2') }}"

    - name: Render worker user_data (identical for every worker)
      ansible.builtin.set_fact:
        worker_user_data: "{{ lookup('template', 'templates/llm-chat/worker-cloud-init.yml.j2', template_vars={
          'llama_archive_name': llama_archive_name, 'llama_sha256': llama_sha256,
          'rpc_port': rpc_port, 'threads': threads,
          'promtail_config': promtail_config }) }}"

    - name: Create RPC worker instances (one per worker_peers entry, each on its own peer)
      cloudcore.cloudcore.instance:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-worker-{{ idx }}"
        image_id: ubuntu-22.04
        flavor: "{{ worker_flavor }}"
        vpc_id: "{{ item.peer_vpc_id }}"
        subnet_id: "{{ item.peer_subnet_id }}"
        security_group_ids: ["{{ item.peer_security_group_id }}"]
        peer_id: "{{ item.peer_id }}"
        user_data: "{{ worker_user_data }}"
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: llm-chat-worker
      loop: "{{ worker_peers }}"
      loop_control:
        index_var: idx
        label: "worker-{{ idx }} -> {{ item.peer_id }}"
      register: created_workers

    - name: Wait for all workers to reach running
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/instances/{{ item.instance.id }}"
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
      register: worker_poll
      until: worker_poll.json.status == "running"
      retries: 30
      delay: 5
      loop: "{{ created_workers.results }}"
      loop_control:
        label: "{{ item.instance.name }}"

    - name: Build the coordinator's --rpc argument from real worker IPs
      ansible.builtin.set_fact:
        rpc_servers: "{{ worker_poll.results | map(attribute='json.private_ip') | map('regex_replace', '$', ':' + (rpc_port | string)) | join(',') }}"

    - name: Build the Web UI defaults JSON (llama-server's own --webui-config-file)
      ansible.builtin.set_fact:
        webui_config_json: "{{ {'temperature': webui_temperature, 'systemMessage': webui_system_message} | to_nice_json }}"

    - name: Load verify_proxy.py source (grounded code verification)
      ansible.builtin.set_fact:
        verify_proxy_source: "{{ lookup('file', 'templates/llm-chat/verify_proxy.py') }}"

    - name: Load CodeMirror assets (Stage 2 — interactive sandbox editor)
      # Same vendored build the Dashboard's own Editor page already
      # ships (ui/vendor/, two levels up from this playbook's own
      # directory) — read fresh and re-embedded into this guest's own
      # cloud-init, since the dashboard's own /vendor/ route only ever
      # reaches the admin host, never a student-facing coordinator.
      ansible.builtin.set_fact:
        codemirror_core_js: "{{ lookup('file', '../../ui/vendor/codemirror.min.js') }}"
        codemirror_core_css: "{{ lookup('file', '../../ui/vendor/codemirror.min.css') }}"
        codemirror_theme_css: "{{ lookup('file', '../../ui/vendor/codemirror-theme-dracula.min.css') }}"
        codemirror_matchbrackets_js: "{{ lookup('file', '../../ui/vendor/codemirror-addon-matchbrackets.min.js') }}"
        codemirror_python_mode_js: "{{ lookup('file', '../../ui/vendor/codemirror-mode-python.min.js') }}"

    - name: Render coordinator user_data
      ansible.builtin.set_fact:
        coordinator_user_data: "{{ lookup('template', 'templates/llm-chat/coordinator-cloud-init.yml.j2', template_vars={
          'llama_archive_name': llama_archive_name, 'llama_sha256': llama_sha256,
          'model_filename': model_filename, 'model_sha256': model_sha256,
          'http_port': http_port, 'context_size': context_size, 'threads': threads,
          'rpc_offload_layers': rpc_offload_layers,
          'rpc_servers': rpc_servers, 'promtail_config': promtail_config,
          'webui_config_json': webui_config_json,
          'verify_proxy_source': verify_proxy_source,
          'enable_verification': enable_verification,
          'verify_timeout_seconds': verify_timeout_seconds,
          'verify_max_memory_mb': verify_max_memory_mb,
          'verify_max_fix_rounds': verify_max_fix_rounds,
          'examples_api_base': examples_api_base,
          'examples_ingestion_token': examples_ingestion_token,
          'sandbox_system_message': sandbox_system_message,
          'codemirror_core_js': codemirror_core_js,
          'codemirror_core_css': codemirror_core_css,
          'codemirror_theme_css': codemirror_theme_css,
          'codemirror_matchbrackets_js': codemirror_matchbrackets_js,
          'codemirror_python_mode_js': codemirror_python_mode_js }) }}"

    - name: Create coordinator instance
      # vpc_id/subnet_id/security_group_ids/peer_id fall back to this
      # build's own local resources when coordinator_peer_id is empty
      # (today's default behaviour) — otherwise switch to the chosen
      # peer's own existing catalogue entries, same per-item override
      # shape the worker loop above already proves works, applied to a
      # single task instead of a loop.
      cloudcore.cloudcore.instance:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-coord"
        image_id: ubuntu-22.04
        flavor: "{{ coordinator_flavor }}"
        vpc_id: "{{ coordinator_peer_vpc_id if coordinator_peer_id else vpc.vpc.id }}"
        subnet_id: "{{ coordinator_peer_subnet_id if coordinator_peer_id else 'subnet-local-01' }}"
        security_group_ids: ["{{ coordinator_peer_security_group_id if coordinator_peer_id else sg.security_group.id }}"]
        peer_id: "{{ coordinator_peer_id }}"
        user_data: "{{ coordinator_user_data }}"
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: llm-chat-coordinator
      register: coordinator

    - name: Wait for coordinator to reach running
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/instances/{{ coordinator.instance.id }}"
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
      register: coordinator_poll
      until: coordinator_poll.json.status == "running"
      retries: 30
      delay: 5

    - name: Create application load balancer
      cloudcore.cloudcore.load_balancer:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ lb_name }}"
        type: application
        vpc_id: "{{ vpc.vpc.id }}"
        subnet_ids:
          - subnet-local-01
        internal: false
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: ingress
      register: lb

    - name: Register coordinator as the LB backend
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/load-balancers/{{ lb.load_balancer.id }}/backends"
        method: POST
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ coordinator.instance.name }}"
          address: "{{ coordinator_poll.json.private_ip }}"
          port: "{{ http_port }}"
        status_code: 201

    - name: Set LB health check to llama-server's real liveness endpoint
      # llama-server's own root path ("/") requires gzip-encoded
      # responses (its embedded Web UI assets are pre-compressed) — a
      # plain health check without Accept-Encoding: gzip gets a 415,
      # exactly the same finding 13-distributed-llm.yml's own F-097
      # made for the same binary. /health is llama-server's real
      # liveness endpoint and needs no special headers.
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/load-balancers/{{ lb.load_balancer.id }}/health-check"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          protocol: HTTP
          path: /health
        status_code: 200

    - name: Show sandbox URL
      ansible.builtin.debug:
        msg: >
          Open this in a real browser (not curl -- the sandbox page needs a
          real browser to run its own JS): http://127.0.0.1:{{ lb.load_balancer.listen_port }}/
          -- an Interactive Sandbox (code editor + grounded Run/Ask loop),
          not a general chat webui (that's no longer reachable at all --
          see llm-chat-interactive-sandbox-Phased-Implementation.md).
          Coordinator {{ coordinator.instance.name }}, {{ worker_peers | length }} worker(s).
