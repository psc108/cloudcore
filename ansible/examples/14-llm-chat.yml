    - name: Create coordinator instance
      # vpc_id/subnet_id/security_group_ids/peer_id fall back to this
      # build's own local resources when coordinator_peer_id is empty
      # (today's default behaviour) — otherwise switch to the chosen
      # peer's own existing catalogue entries, same per-item override
      # shape the worker loop above already proves works, applied to a
      # single task instead of a loop.
      cloudcore.cloudcore.instance:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-coord"
        image_id: ubuntu-22.04
        flavor: "{{ coordinator_flavor }}"
        vpc_id: "{{ coordinator_peer_vpc_id if coordinator_peer_id else vpc.vpc.id }}"
        subnet_id: "{{ coordinator_peer_subnet_id if coordinator_peer_id else 'subnet-local-01' }}"
        security_group_ids: ["{{ coordinator_peer_security_group_id if coordinator_peer_id else sg.security_group.id }}"]
        peer_id: "{{ coordinator_peer_id }}"
        user_data: "{{ coordinator_user_data }}"
        users: "{{ claude_debug_users }}"
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: llm-chat-coordinator
      register: coordinator

    - name: Wait for coordinator to reach running
      ansible.builtin.uri:
        url: "{{ cloudcore_api_url }}/v1/instances/{{ coordinator.instance.id }}"
        headers:
          Authorization: "Bearer {{ cloudcore_api_token }}"
      register: coordinator_poll
      until: coordinator_poll.json.status == "running"
      retries: 30
      delay: 5

    - name: Create application load balancer
      cloudcore.cloudcore.load_balancer:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        name: "{{ lb_name }}"
        type: application
        vpc_id: "{{ vpc.vpc.id }}"
        subnet_ids:
          - subnet-local-01
        internal: false
        tags:
          Environment: "{{ env }}"
          Project: "{{ project }}"
          Owner: "{{ default_owner }}"
          ManagedBy: ansible
          Role: ingress
      register: lb

    # Real target groups + a listener with routing_rules, matching
    # examples/llm-chat/main.tf's own model exactly (not the older
    # simple single-backend model 09-ghidra-workstation.yml/
    # 11-wifi-sniffer.yml still use) — this is what makes path-based
    # routing to sandbox_terminal.py's own /terminal AND the preview
    # ports possible at all. llama-server's own root path ("/") requires
    # gzip-encoded responses (its embedded Web UI assets are
    # pre-compressed) — a plain health check without Accept-Encoding:
    # gzip gets a 415, exactly the same finding 13-distributed-llm.yml's
    # own F-097 made for the same binary. /health is llama-server's real
    # liveness endpoint (proxied through by verify_proxy.py) and needs
    # no special headers.
    - name: Create coordinator target group
      cloudcore.cloudcore.lb_target_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        lb_id: "{{ lb.load_balancer.id }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-tg"
        port: "{{ http_port }}"
        protocol: http
        health_check:
          path: /health
        targets:
          - instance_id: "{{ coordinator.instance.id }}"
            port: "{{ http_port }}"
      register: coord_tg

    # sandbox_terminal.py is a WebSocket-only service — a plain GET /
    # never completes the WS handshake, so the websockets library
    # correctly answers 426 Upgrade Required; without its own
    # process_request health hook (see that file) HAProxy would read
    # that as unhealthy and mark the whole backend down — same finding
    # examples/llm-chat/main.tf's own terminal target group comment
    # documents.
    - name: Create terminal target group
      cloudcore.cloudcore.lb_target_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        lb_id: "{{ lb.load_balancer.id }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-term-tg"
        port: "{{ terminal_port }}"
        protocol: http
        health_check:
          path: /health
        targets:
          - instance_id: "{{ coordinator.instance.id }}"
            port: "{{ terminal_port }}"
      register: term_tg

    - name: Create preview target groups
      cloudcore.cloudcore.lb_target_group:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        lb_id: "{{ lb.load_balancer.id }}"
        name: "{{ project }}-{{ env }}-{{ build_suffix }}-llm-chat-preview-{{ item }}-tg"
        port: "{{ item }}"
        protocol: http
        health_check:
          path: /health
        targets:
          - instance_id: "{{ coordinator.instance.id }}"
            port: "{{ item }}"
      loop: "{{ preview_ports }}"
      register: preview_tgs

    - name: Create main listener (with /terminal routing rule)
      cloudcore.cloudcore.lb_listener:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        lb_id: "{{ lb.load_balancer.id }}"
        port: "{{ http_port }}"
        protocol: http
        target_group_id: "{{ coord_tg.target_group.id }}"
        routing_rules:
          - priority: 10
            conditions:
              path_pattern: "/terminal*"
            target_group_id: "{{ term_tg.target_group.id }}"

    - name: Create preview listeners
      cloudcore.cloudcore.lb_listener:
        api_url: "{{ cloudcore_api_url }}"
        api_token: "{{ cloudcore_api_token }}"
        lb_id: "{{ lb.load_balancer.id }}"
        port: "{{ item.item }}"
        protocol: http
        target_group_id: "{{ item.target_group.id }}"
      loop: "{{ preview_tgs.results }}"

    - name: Show sandbox URL
      ansible.builtin.debug:
        msg: >
          Open this in a real browser (not curl -- the sandbox page needs a
          real browser to run its own JS): http://127.0.0.1:{{ http_port }}/
          -- the Terminal panel there gives a real isolated shell, and ports
          {{ preview_ports | join(', ') }} are reachable at this same host
          for previewing any web app a student runs in it.
          -- an Interactive Sandbox (code editor + grounded Run/Ask loop),
          not a general chat webui (that's no longer reachable at all --
          see llm-chat-interactive-sandbox-Phased-Implementation.md).
          Coordinator {{ coordinator.instance.name }}, {{ worker_peers | length }} worker(s).
